<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 622" width="800" height="622" role="img" aria-label="QuantBot runtime topology: three Python processes sharing one Docker volume on a single free-tier ARM VM, reaching the public internet through nginx and an outbound Cloudflare Tunnel">
  <title>QuantBot runtime topology</title>
  <desc>Binance feeds bot.py (futures) and notifier.py (spot RSI radar). Both write to a shared Docker named volume, which dashboard.py reads. The dashboard is served through nginx on port 8888 and reaches the internet via an outbound-only Cloudflare Tunnel. Everything inside the dashed boundary runs on one Oracle Cloud always-free ARM instance.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f8a7e"/>
    </marker>
    <style>
      .box   { fill:#ffffff; stroke:#e2dfd6; stroke-width:1.5; }
      .mono  { font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .sans  { font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif; }
      .ttl   { font-size:15px; font-weight:600; }
      .sub   { font-size:12px; fill:#3a3a36; }
      .note  { font-size:11.5px; fill:#7a7a72; }
      .tiny  { font-size:11px; fill:#7a7a72; }
      .flow  { stroke:#8f8a7e; stroke-width:1.4; fill:none; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="622" fill="#faf9f6"/>

  <!-- ── EXCHANGE ── -->
  <rect class="box" x="260" y="14" width="240" height="42" rx="6"/>
  <text class="mono ttl" x="380" y="34" fill="#0f0f0e" text-anchor="middle">Binance</text>
  <text class="sans tiny" x="380" y="48" text-anchor="middle">market data + order execution via ccxt</text>

  <!-- split to the two clients -->
  <path class="flow" d="M380,56 V72 H206 V96" marker-end="url(#arw)"/>
  <path class="flow" d="M380,56 V72 H554 V96" marker-end="url(#arw)"/>
  <text class="mono tiny" x="214" y="66">binanceusdm · futures</text>
  <text class="mono tiny" x="546" y="66" text-anchor="end">binance spot · RSI radar</text>

  <!-- ── THE VM BOUNDARY ── -->
  <rect x="38" y="78" width="684" height="498" rx="10" fill="none" stroke="#c9c4b7" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="446" y="568" width="272" height="16" fill="#faf9f6"/>
  <text class="mono tiny" x="714" y="580" text-anchor="end">OCI A1.Flex · 1 OCPU / 6 GB ARM · $0/mo</text>

  <!-- ── BOT ── -->
  <rect class="box" x="56" y="96" width="300" height="112" rx="6"/>
  <text class="mono ttl" x="74" y="122" fill="#c84b11">bot.py</text>
  <text class="sans sub" x="74" y="142">trading engine</text>
  <text class="sans note" x="74" y="163">the ONLY writer of trade state</text>
  <text class="mono tiny" x="74" y="184">imports corpus_manager.py</text>

  <!-- ── NOTIFIER ── -->
  <rect class="box" x="404" y="96" width="300" height="112" rx="6"/>
  <text class="mono ttl" x="422" y="122" fill="#1a4a8a">notifier.py</text>
  <text class="sans sub" x="422" y="142">alerts + remote control</text>
  <text class="sans note" x="422" y="163">the ONLY process that talks to Telegram</text>
  <text class="mono tiny" x="422" y="184">TradeWatcher · Heartbeat · RSIScanner</text>

  <path class="flow" d="M206,208 V236" marker-end="url(#arw)"/>
  <path class="flow" d="M554,208 V236" marker-end="url(#arw)"/>
  <text class="sans tiny" x="214" y="227" fill="#1a6b4a">writes</text>
  <text class="sans tiny" x="546" y="227" fill="#1a4a8a" text-anchor="end">reads all · writes flags</text>

  <!-- ── SHARED VOLUME ── -->
  <rect x="56" y="236" width="648" height="86" rx="6" fill="#f4f1e8" stroke="#ddd8cc" stroke-width="1.5"/>
  <text xml:space="preserve" class="mono tiny" x="74" y="259">DATA_DIR — docker named volume  quantbot_data</text>
  <text xml:space="preserve" class="mono" x="74" y="284" font-size="12" fill="#3a3a36">bot_state.json    corpus_state.json    trade_log.csv</text>
  <text xml:space="preserve" class="mono" x="74" y="305" font-size="12" fill="#3a3a36">rsi_history.json    rsi_alert_state.json    bot_paused.flag</text>

  <path class="flow" d="M380,322 V350" marker-end="url(#arw)"/>
  <text class="sans tiny" x="390" y="341">reads only — never writes</text>

  <!-- ── DASHBOARD ── -->
  <rect class="box" x="230" y="350" width="300" height="56" rx="6"/>
  <text class="mono" x="246" y="374" font-size="14" font-weight="600" fill="#1a6b4a">dashboard.py</text>
  <text class="sans note" x="246" y="393">Dash + Plotly :8050 · bound to 127.0.0.1</text>

  <path class="flow" d="M380,406 V430" marker-end="url(#arw)"/>

  <!-- ── NGINX ── -->
  <rect class="box" x="230" y="430" width="300" height="50" rx="6"/>
  <text class="mono" x="246" y="452" font-size="13.5" font-weight="600" fill="#0f0f0e">nginx:alpine  :8888</text>
  <text class="sans tiny" x="246" y="469">server_tokens off · themed 401/50x pages</text>

  <path class="flow" d="M380,480 V504" marker-end="url(#arw)"/>

  <!-- ── TUNNEL ── -->
  <rect class="box" x="230" y="504" width="300" height="50" rx="6"/>
  <text class="mono" x="246" y="526" font-size="13.5" font-weight="600" fill="#c84b11">cloudflared</text>
  <text class="sans tiny" x="246" y="543">outbound tunnel · zero inbound ports</text>

  <path class="flow" d="M380,554 V592" marker-end="url(#arw)"/>

  <text class="mono" x="380" y="612" font-size="13" fill="#1a4a8a" text-anchor="middle">https://quantbot.asitminz.com</text>
</svg>
